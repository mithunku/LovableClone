version: "3.8"

services:
  postgres:
    image: postgres:alpine3.23
    container_name: postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: testDB
      POSTGRES_USER: testUser
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

#volumes is the location of data to be storeed when container stops
    volumes:
      - D:\postgresData:/var/lib/postgresql

  minio:
    image: quay.io/minio/minio:latest
    container_name: minio

    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    command: server /data --console-address ":9001"

volumes:
  postgres-data:
  minio-data: